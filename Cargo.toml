[package]
name = "statifier"
version = "0.1.0"
edition = "2024"
# The oldest Rust this crate supports; it matches the floor the predicator
# crate (predicator-rs 0.1.0) declares.
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/riddler/statifier-rs"
readme = "README.md"
description = "An SCXML statechart interpreter core, a conformant sibling of the Elixir statifier package."
keywords = ["statechart", "scxml", "state-machine", "interpreter", "workflow"]
categories = ["algorithms", "parser-implementations"]
include = ["/src/", "/Cargo.toml", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[features]
default = []
# Serialize and Deserialize for a position, an effect and a stopped chart's
# answer, with the predicator crate's own for its values.
serde = ["dep:serde", "predicator-rs/serde"]
# The Basic HTTP transport seam: the Transport trait a host implements and
# the request, response and error values it exchanges. Adds no dependency;
# the crate ships no transport.
basichttp = []

[dependencies]
# The predicator crate: compiles and evaluates the conditions, values and
# scripts a chart writes. The crate's one unconditional runtime dependency.
predicator-rs = "0.1"
# Behind the `serde` feature alone, off by default. No derive: the
# implementations are written by hand, so no procedural macro joins the graph.
serde = { version = "1", optional = true, default-features = false, features = ["std"] }

# The conformance apparatus under tests/conformance/ reads the vendored corpus
# (JSON) and recomputes its SHA-256 hash; neither crate is a dependency of the
# library.
[dev-dependencies]
serde_json = "1"
sha2 = "0.11"

[package.metadata.docs.rs]
all-features = true
